
  name: Go CI

  on:
    push:
    pull_request:

  permissions:
    contents: read

  jobs:
    build-and-test:
      runs-on: ubuntu-latest
      steps:
        - name: Get the code
          uses: actions/checkout@v7

        - name: Install Go
          uses: actions/setup-go@v7
          with:
            go-version-file: go.mod

        - name: Build
          run: go build ./...

        - name: Test
          run: go test ./...
